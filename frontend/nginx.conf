# SolarHand PWA — nginx site config (dropped into /etc/nginx/conf.d/default.conf,
# so it is a single server block inside the stock http {} context).
#
# Responsibilities:
#   1. Serve the built SPA, falling back to index.html for client-side routes.
#   2. Reverse-proxy /api/* to the FastAPI container, stripping the /api prefix
#      (the API serves its routes at the root: /auth, /assets, /jobs, ...).
#   3. Apply PWA-correct caching: never cache the shell or the service worker;
#      cache content-hashed assets aggressively.
#
# Why the /api prefix: /assets, /jobs and /sync are ALSO client-side routes in
# the SPA, so they collide with the same-named API paths. Namespacing the API
# under /api/ is the only way to disambiguate on a single origin.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text-like responses; assets are already minified.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # ---- API reverse proxy ------------------------------------------------
    # Trailing slash on proxy_pass strips the matched "/api/" prefix, so
    # /api/auth/login -> http://api:8000/auth/login.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Content-hashed, immutable build output ---------------------------
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Workbox runtime is content-hashed too, so it may be cached long-term.
    location ~* ^/workbox-.*\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- PWA control files: always revalidate -----------------------------
    # The service worker must never be served stale or updates never ship.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Manifest needs the correct MIME (stock mime.types omits .webmanifest).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The app shell is the update entry point — do not let it go stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- SPA fallback -----------------------------------------------------
    # Real file (icons, favicon) -> served; a real dir -> its index; anything
    # else (client-side routes like /jobs, /assets, /sync) -> the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
