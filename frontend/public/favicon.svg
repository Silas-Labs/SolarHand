<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SolarHand">
  <rect width="64" height="64" rx="14" fill="#10152e"/>
  <!-- module frame -->
  <rect x="12" y="12" width="40" height="40" rx="3.5" fill="#161d3f"/>
  <!-- photovoltaic cells (3 x 3) -->
  <g>
    <!-- row 1 -->
    <rect x="14.5" y="14.5" width="10.5" height="10.5" rx="1.5" fill="#1b2450"/>
    <rect x="26.75" y="14.5" width="10.5" height="10.5" rx="1.5" fill="#1b2450"/>
    <rect x="39" y="14.5" width="10.5" height="10.5" rx="1.5" fill="#f2a413"/>
    <!-- row 2 -->
    <rect x="14.5" y="26.75" width="10.5" height="10.5" rx="1.5" fill="#1b2450"/>
    <rect x="26.75" y="26.75" width="10.5" height="10.5" rx="1.5" fill="#1b2450"/>
    <rect x="39" y="26.75" width="10.5" height="10.5" rx="1.5" fill="#2f7d55"/>
    <!-- row 3 -->
    <rect x="14.5" y="39" width="10.5" height="10.5" rx="1.5" fill="#1b2450"/>
    <rect x="26.75" y="39" width="10.5" height="10.5" rx="1.5" fill="#2f7d55"/>
    <rect x="39" y="39" width="10.5" height="10.5" rx="1.5" fill="#2f7d55"/>
  </g>
  <!-- busbar fingers -->
  <g stroke="#c9cee6" stroke-width="0.6" opacity="0.45">
    <line x1="19.75" y1="14.5" x2="19.75" y2="49.5"/>
    <line x1="32" y1="14.5" x2="32" y2="49.5"/>
    <line x1="44.25" y1="14.5" x2="44.25" y2="49.5"/>
  </g>
</svg>
